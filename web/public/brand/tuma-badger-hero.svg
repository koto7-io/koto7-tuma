<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="600" height="400" fill="#0D0C0A" />

  <style>
    .net-node {
      fill: none;
      stroke: #38FFF6;
      stroke-width: 1.3;
      opacity: 0.6;
    }

    .lead-node {
      opacity: 1;
      filter: drop-shadow(0 0 4px #38FFF6);
    }

    .travel-dot {
      filter: drop-shadow(0 0 5px #38FFF6);
    }
  </style>

  <g transform="translate(10, -10)" fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <!-- ==================== POLYGON WIREFRAME ==================== -->
    
    <!-- Snout & Jaw Structure -->
    <polygon points="485,210 445,225 415,215" stroke="#00A896" stroke-width="2" />
    <polygon points="485,210 460,230 420,235" stroke="#02C39A" stroke-width="2" />
    <polygon points="420,235 445,225 390,228" stroke="#05668D" stroke-width="2" />

    <!-- Head & Cheeks -->
    <polygon points="415,215 450,195 425,185 390,200" stroke="#11B5AC" stroke-width="2" />
    <polygon points="450,195 435,215 415,215" stroke="#20E2D7" stroke-width="1.8" />
    <polygon points="390,200 425,185 395,175 365,190" stroke="#0EA199" stroke-width="2" />
    <polygon points="390,228 415,215 360,215" stroke="#00A896" stroke-width="2" />
    <polygon points="360,215 390,200 335,205" stroke="#02C39A" stroke-width="2" />

    <!-- Neck & Throat -->
    <polygon points="360,215 335,205 320,235 345,245" stroke="#11B5AC" stroke-width="2" />
    <polygon points="345,245 320,235 305,265 330,270" stroke="#05668D" stroke-width="2" />
    <polygon points="390,228 360,215 345,245 375,255" stroke="#00A896" stroke-width="2" />

    <!-- Chest & Shoulder -->
    <polygon points="335,205 300,215 285,245 320,235" stroke="#1CD3C8" stroke-width="2" />
    <polygon points="320,235 285,245 280,280 305,265" stroke="#0EA199" stroke-width="2" />
    <polygon points="330,270 305,265 295,305 320,310" stroke="#02C39A" stroke-width="2" />
    
    <!-- Front Leg 1 (Foreground Right Foot) -->
    <polygon points="320,310 295,305 325,350 355,350" stroke="#11B5AC" stroke-width="2.2" />
    <polygon points="325,350 355,350 385,360 340,360" stroke="#38FFF6" stroke-width="2.2" />

    <!-- Front Left Foot (Leg 2 / Foreground Left) -->
    <polygon points="375,255 345,245 360,290 390,295" stroke="#05668D" stroke-width="2" />
    <polygon points="360,290 390,295 380,335 350,330" stroke="#00A896" stroke-width="2" />
    <polygon points="350,330 380,335 410,360 370,360" stroke="#20E2D7" stroke-width="2.2" />
    <polygon points="370,360 410,360 425,365 385,365" stroke="#38FFF6" stroke-width="2.2" />

    <!-- Abdomen & Lower Flank -->
    <polygon points="285,245 250,240 235,270 280,280" stroke="#0EA199" stroke-width="2" />
    <polygon points="280,280 235,270 220,300 265,305" stroke="#00A896" stroke-width="2" />
    <polygon points="265,305 220,300 210,325 250,320" stroke="#02C39A" stroke-width="2" />

    <!-- Hindquarters & Heavy Thigh -->
    <polygon points="250,240 205,235 185,265 235,270" stroke="#11B5AC" stroke-width="2" />
    <polygon points="235,270 185,265 170,295 220,300" stroke="#05668D" stroke-width="2" />
    <polygon points="220,300 170,295 160,325 210,325" stroke="#00A896" stroke-width="2" />

    <!-- Back Leg 1 (Foreground Right) -->
    <polygon points="210,325 160,325 175,360 215,360" stroke="#02C39A" stroke-width="2.2" />
    <polygon points="175,360 215,360 235,365 190,365" stroke="#38FFF6" stroke-width="2.2" />

    <!-- Back Leg 2 (Background Left) -->
    <polygon points="185,265 155,270 145,300 170,295" stroke="#0EA199" stroke-width="2" />
    <polygon points="170,295 145,300 135,340 160,340" stroke="#00A896" stroke-width="2" />
    <polygon points="135,340 160,340 170,350 140,350" stroke="#20E2D7" stroke-width="2" />

    <!-- Tail -->
    <polygon points="205,235 170,225 150,250 185,265" stroke="#05668D" stroke-width="2" />
    <polygon points="170,225 125,215 105,245 150,250" stroke="#00A896" stroke-width="2" />
    <polygon points="125,215 85,190 65,225 105,245" stroke="#02C39A" stroke-width="2" />
    <polygon points="85,190 55,155 30,195 65,225" stroke="#11B5AC" stroke-width="2.2" />
    <polygon points="55,155 20,110 30,195" stroke="#20E2D7" stroke-width="2.2" />
    <polygon points="55,155 20,110 35,105" stroke="#38FFF6" stroke-width="2.5" />

    <!-- Dorsal Stripe -->
    <polygon points="485,210 450,195 425,185 460,190" stroke="#20E2D7" stroke-width="2.2" />
    <polygon points="460,190 425,185 395,175 430,175" stroke="#11B5AC" stroke-width="2" />
    <polygon points="430,175 395,175 365,190 390,160" stroke="#38FFF6" stroke-width="2" />
    <polygon points="390,160 365,190 335,205 350,160" stroke="#1CD3C8" stroke-width="2" />
    <polygon points="350,160 335,205 300,215 310,165" stroke="#0EA199" stroke-width="2" />
    <polygon points="310,165 300,215 285,245 260,180" stroke="#20E2D7" stroke-width="2" />
    <polygon points="260,180 285,245 250,240 215,195" stroke="#38FFF6" stroke-width="2" />
    <polygon points="215,195 250,240 205,235 170,210" stroke="#1CD3C8" stroke-width="2" />
    <polygon points="170,210 205,235 170,225 130,195" stroke="#11B5AC" stroke-width="2" />
    <polygon points="130,195 170,225 125,215 85,170" stroke="#0EA199" stroke-width="2" />
    <polygon points="85,170 125,215 85,190 55,135" stroke="#20E2D7" stroke-width="2.2" />
    <polygon points="55,135 85,190 55,155 35,105" stroke="#1CD3C8" stroke-width="2.2" />
    <polygon points="35,105 55,155 20,110" stroke="#38FFF6" stroke-width="2.5" />

    <!-- ==================== ANIMATED NETWORK INTERSECTION NODES ==================== -->
    <g fill="#38FFF6" stroke="none">
      <!-- Extremities / Lead Focus Nodes -->
      <circle cx="485" cy="210" r="5.5" fill="#FFFFFF" class="lead-node" /> <!-- Snout tip -->
      <circle cx="20" cy="110" r="5.5" fill="#FFFFFF" class="lead-node delay-3" />  <!-- Tail tip -->

      <!-- Head & Crown Nodes -->
      <circle cx="445" cy="225" r="4" class="net-node delay-1" />
      <circle cx="460" cy="230" r="4" class="net-node delay-2" />
      <circle cx="420" cy="235" r="4" class="net-node delay-3" />
      <circle cx="415" cy="215" r="4" class="net-node delay-4" />
      <circle cx="450" cy="195" r="4" class="net-node delay-1" />
      <circle cx="425" cy="185" r="4" class="net-node delay-2" />
      <circle cx="460" cy="190" r="4" class="net-node delay-5" />
      <circle cx="430" cy="175" r="4" class="net-node delay-3" />
      <circle cx="395" cy="175" r="4" class="net-node delay-4" />
      <circle cx="390" cy="160" r="4.5" fill="#FFFFFF" class="lead-node delay-1" />
      <circle cx="390" cy="200" r="4" class="net-node delay-2" />
      <circle cx="390" cy="228" r="4" class="net-node delay-5" />

      <!-- Neck & Chest Nodes -->
      <circle cx="365" cy="190" r="4" class="net-node delay-1" />
      <circle cx="360" cy="215" r="4" class="net-node delay-3" />
      <circle cx="350" cy="160" r="4" class="net-node delay-2" />
      <circle cx="335" cy="205" r="4" class="net-node delay-4" />
      <circle cx="345" cy="245" r="4" class="net-node delay-5" />
      <circle cx="375" cy="255" r="4" class="net-node delay-1" />
      <circle cx="320" cy="235" r="4" class="net-node delay-2" />
      <circle cx="310" cy="165" r="4" class="net-node delay-3" />
      <circle cx="300" cy="215" r="4" class="net-node delay-4" />
      <circle cx="305" cy="265" r="4" class="net-node delay-1" />
      <circle cx="330" cy="270" r="4" class="net-node delay-2" />

      <!-- Front Legs & Paws Nodes -->
      <circle cx="295" cy="305" r="4" class="net-node delay-3" />
      <circle cx="320" cy="310" r="4" class="net-node delay-4" />
      <circle cx="325" cy="350" r="4" class="net-node delay-5" />
      <circle cx="355" cy="350" r="4" class="net-node delay-1" />
      <circle cx="385" cy="360" r="5" fill="#FFFFFF" class="lead-node delay-2" />
      <circle cx="340" cy="360" r="4" class="net-node delay-3" />

      <circle cx="360" cy="290" r="4" class="net-node delay-4" />
      <circle cx="390" cy="295" r="4" class="net-node delay-5" />
      <circle cx="350" cy="330" r="4" class="net-node delay-1" />
      <circle cx="380" cy="335" r="4" class="net-node delay-2" />
      <circle cx="370" cy="360" r="4" class="net-node delay-3" />
      <circle cx="410" cy="360" r="4" class="net-node delay-4" />
      <circle cx="425" cy="365" r="5" fill="#FFFFFF" class="lead-node delay-5" />
      <circle cx="385" cy="365" r="4" class="net-node delay-1" />

      <!-- Spine & Body Center Nodes -->
      <circle cx="285" cy="245" r="4" class="net-node delay-2" />
      <circle cx="280" cy="280" r="4" class="net-node delay-3" />
      <circle cx="260" cy="180" r="4" class="net-node delay-4" />
      <circle cx="250" cy="240" r="4" class="net-node delay-5" />
      <circle cx="235" cy="270" r="4" class="net-node delay-1" />
      <circle cx="265" cy="305" r="4" class="net-node delay-2" />
      <circle cx="220" cy="300" r="4" class="net-node delay-3" />
      <circle cx="210" cy="325" r="4" class="net-node delay-4" />
      <circle cx="250" cy="320" r="4" class="net-node delay-5" />
      <circle cx="215" cy="195" r="4" class="net-node delay-1" />

      <!-- Hindquarters & Back Legs Nodes -->
      <circle cx="205" cy="235" r="4" class="net-node delay-2" />
      <circle cx="185" cy="265" r="4" class="net-node delay-3" />
      <circle cx="170" cy="210" r="4" class="net-node delay-4" />
      <circle cx="170" cy="295" r="4" class="net-node delay-5" />
      <circle cx="160" cy="325" r="4" class="net-node delay-1" />

      <circle cx="175" cy="360" r="4" class="net-node delay-2" />
      <circle cx="215" cy="360" r="4" class="net-node delay-3" />
      <circle cx="235" cy="365" r="5" fill="#FFFFFF" class="lead-node delay-4" />
      <circle cx="190" cy="365" r="4" class="net-node delay-5" />

      <circle cx="155" cy="270" r="4" class="net-node delay-1" />
      <circle cx="145" cy="300" r="4" class="net-node delay-2" />
      <circle cx="135" cy="340" r="4" class="net-node delay-3" />
      <circle cx="160" cy="340" r="4" class="net-node delay-4" />
      <circle cx="170" cy="350" r="5" fill="#FFFFFF" class="lead-node delay-5" />
      <circle cx="140" cy="350" r="4" class="net-node delay-1" />

      <!-- Tail Ridge & Base Nodes -->
      <circle cx="170" cy="225" r="4" class="net-node delay-2" />
      <circle cx="150" cy="250" r="4" class="net-node delay-3" />
      <circle cx="130" cy="195" r="4" class="net-node delay-4" />
      <circle cx="125" cy="215" r="4" class="net-node delay-5" />
      <circle cx="105" cy="245" r="4" class="net-node delay-1" />
      <circle cx="85" cy="170" r="4" class="net-node delay-2" />
      <circle cx="85" cy="190" r="4" class="net-node delay-3" />
      <circle cx="65" cy="225" r="4" class="net-node delay-4" />
      <circle cx="55" cy="135" r="4" class="net-node delay-5" />
      <circle cx="55" cy="155" r="4" class="net-node delay-1" />
      <circle cx="35" cy="105" r="4" class="net-node delay-2" />
      <circle cx="30" cy="195" r="4" class="net-node delay-3" />
    </g>
    <!-- ==================== TRAVELING RELAY DOTS (distinct routes, distinct destinations) ==================== -->
    <!-- Route A: snout to tail tip, along the spine -->
    <circle r="5" fill="#38FFF6" class="travel-dot">
      <animateMotion path="M485,210 L460,190 L430,175 L390,160 L350,160 L310,165 L260,180 L215,195 L170,210 L130,195 L85,170 L55,135 L35,105 L20,110"
        dur="4.5s" begin="0s" repeatCount="indefinite" />
    </circle>
    <!-- Route B: branches off the spine to the front-right paw -->
    <circle r="5" fill="#20E2D7" class="travel-dot">
      <animateMotion path="M285,245 L320,235 L305,265 L320,310 L355,350 L385,360"
        dur="2s" begin="0.6s" repeatCount="indefinite" />
    </circle>
    <!-- Route C: branches off the spine to the back-left leg -->
    <circle r="5" fill="#02C39A" class="travel-dot">
      <animateMotion path="M250,240 L235,270 L220,300 L210,325 L160,325 L215,360 L235,365"
        dur="2.2s" begin="1.2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
